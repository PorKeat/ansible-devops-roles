---
#
# ------------------------------------------------------------
# Edit This File Only
# ------------------------------------------------------------
#
#
# ------------------------------------------------------------
# Service Selection
# ------------------------------------------------------------
#
jenkins: false
sonarqube: false
harbor: false
hashicorp_vault: true
minio: true

#
# ------------------------------------------------------------
# Target Layout
# ------------------------------------------------------------
#
# single | split
target_layout: single

#
# ------------------------------------------------------------
# Shared Target Connection
# ------------------------------------------------------------
#
# ssh | local
ansible_connection: ssh
ansible_host: 35.247.184.216
ansible_user: alexkgm
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_private_key_file: ~/.ssh/google_compute_engine
# Optional SSH override.
# First connection: -o StrictHostKeyChecking=accept-new
# Temporary bypass only: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new

#
# ------------------------------------------------------------
# Split Target Connection
# ------------------------------------------------------------
#
# Uncomment these when target_layout is split

