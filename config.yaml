#
# ------------------------------------------------------------
# Shared Settings
# ------------------------------------------------------------
#
# ----- Global -----
# present | absent
deployment_state: present
# docker | kubernetes
global_deploy_mode: docker
enable_tls: true
vault_enable_tls: true
tls_email: alexkgm2412@gmail.com

# ----- Domains -----
use_domain: true
jenkins_domain: jenkins-a8s.cambostack.app
sonarqube_domain: sonar-a8s.cambostack.app
harbor_domain: harbor-a8s.cambostack.app
vault_domain: vault.autonomous-istad.com
minio_api_domain: minio.autonomous-istad.com
minio_console_domain: minio-console.autonomous-istad.com

# ----- Jenkins -----
jenkins_image: jenkins/jenkins:lts
jenkins_http_port: 8080
jenkins_agent_port: 50000

# ----- SonarQube -----
sonarqube_image: sonarqube:community
postgres_image: postgres:15
sonarqube_http_port: 9000
postgres_port: 5432
sonarqube_db_name: sonarqube
sonarqube_db_user: sonarqube
sonarqube_db_password: 1234

# ----- Harbor -----
harbor_version: 2.14.1
harbor_http_port: 8081
harbor_https_port: 8443
harbor_trivy_enabled: true
harbor_admin_password: Harbor12345
harbor_database_password: root123

# ----- Vault -----
# Docker-only in this repo
vault_version: 1.21.4
# testing | production
# testing: uses vault_root_token below
# production: Vault generates root token during vault operator init
vault_mode: production
# auto-unseal Vault automatically using local vault_init.json if it is sealed
vault_auto_unseal: true
vault_http_port: 8200
vault_cluster_port: 8201
# testing only: run just vault-token
# production: ignored
vault_root_token: vault-dev-1283927ef1773df0c7448543d7e178582222cb32e536a969

# ----- MinIO -----
# use 2 separate domains for MinIO in domain mode
minio_image: minio/minio:latest
minio_api_port: 9000
minio_console_port: 9001
minio_root_user: alexkgm
# at least 8 characters
minio_root_password: alexkgm123

#
# ------------------------------------------------------------
# Docker Settings
# ------------------------------------------------------------
#
# ----- Global -----
install_docker: true

# ----- Jenkins -----
jenkins_install_dir: /opt/jenkins

# ----- SonarQube -----
sonarqube_install_dir: /opt/sonarqube

# ----- Harbor -----
harbor_install_dir: /opt/harbor

# ----- Vault -----
vault_install_dir: /opt/vault

# ----- MinIO -----
minio_install_dir: /opt/minio

#
# ------------------------------------------------------------
# Kubernetes Settings
# ------------------------------------------------------------
#
# ----- Global -----
# Uncomment these when global_deploy_mode is kubernetes
# ansible_host can be the control-plane node
# your domain can still point to the worker or node that schedule
# kubeconfig is auto-detected from common paths on the remote host
# optional override for custom setups:
# k8s_kubeconfig_override_path: /etc/kubernetes/admin.conf
ingress_class_name: nginx

# ----- Jenkins -----
jenkins_namespace: jenkins
jenkins_storage_size: 10Gi
# jenkins_storage_class_name works only when PVC is enabled
# examples:
# jenkins_storage_class_name: local-path   # node-local persistent storage
# jenkins_storage_class_name: longhorn     # Longhorn-managed persistent storage
# jenkins_storage_class_name: ""           # use cluster default storage class
jenkins_storage_class_name: local-path
# jenkins_use_pvc: false          # quick test only, no persistent Jenkins data
# jenkins_k8s_node_port: 30080    # IP mode URL becomes http://<server-ip>:30080
jenkins_ingress_tls_secret_name: jenkins-tls

# ----- SonarQube -----
# sonarqube_namespace: sonarqube
# sonarqube_storage_size: 10Gi
# postgres_storage_size: 8Gi
# sonarqube_k8s_node_port: 30900    # IP mode URL becomes http://<server-ip>:30900
