---
- name: Set requested log service
  ansible.builtin.set_fact:
    requested_log_service: "{{ log_service | default('all') }}"
    requested_log_lines: "{{ log_lines | default(100) | int }}"

- name: Show Jenkins Docker logs
  ansible.builtin.command:
    cmd: "docker logs --tail {{ requested_log_lines }} {{ jenkins_container_name }}"
  register: jenkins_docker_logs
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['jenkins_targets']
    - requested_log_service in ['all', 'jenkins']
    - jenkins_deploy_mode == "docker"

- name: Print Jenkins Docker logs
  ansible.builtin.debug:
    msg: |
      ===== Jenkins ({{ inventory_hostname }}) =====
      {{ jenkins_docker_logs.stdout | default(jenkins_docker_logs.stderr, true) | default('No logs found.', true) }}
  when:
    - jenkins_docker_logs is defined
    - inventory_hostname in groups['jenkins_targets']
    - requested_log_service in ['all', 'jenkins']
    - jenkins_deploy_mode == "docker"

- name: List Jenkins Kubernetes pods
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig {{ jenkins_kubeconfig_path }} -n {{ jenkins_namespace }} get pods -o name"
  register: jenkins_k8s_pods
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['jenkins_targets']
    - requested_log_service in ['all', 'jenkins']
    - jenkins_deploy_mode == "k8s"

- name: Show Jenkins Kubernetes logs
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig {{ jenkins_kubeconfig_path }} -n {{ jenkins_namespace }} logs --all-containers=true --tail={{ requested_log_lines }} {{ jenkins_k8s_pod }}"
  loop: "{{ jenkins_k8s_pods.stdout_lines | default([]) }}"
  loop_control:
    loop_var: jenkins_k8s_pod
  register: jenkins_k8s_logs
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['jenkins_targets']
    - requested_log_service in ['all', 'jenkins']
    - jenkins_deploy_mode == "k8s"

- name: Print Jenkins Kubernetes logs
  ansible.builtin.debug:
    msg: |
      ===== Jenkins ({{ inventory_hostname }}) {{ item.item }} =====
      {{ item.stdout | default(item.stderr, true) | default('No logs found.', true) }}
  loop: "{{ jenkins_k8s_logs.results | default([]) }}"
  when:
    - inventory_hostname in groups['jenkins_targets']
    - requested_log_service in ['all', 'jenkins']
    - jenkins_deploy_mode == "k8s"

