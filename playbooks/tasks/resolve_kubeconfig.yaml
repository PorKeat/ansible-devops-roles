---
- name: Check configured kubeconfig path
  ansible.builtin.stat:
    path: "{{ k8s_kubeconfig_path }}"
  register: configured_kubeconfig_stat
  when: platform_deploy_mode == "k8s"

- name: Build kubeconfig candidate paths
  ansible.builtin.set_fact:
    k8s_kubeconfig_candidate_paths:
      - "{{ k8s_kubeconfig_path }}"
      - /etc/kubernetes/admin.conf
      - /etc/rancher/k3s/k3s.yaml
      - /var/snap/microk8s/current/credentials/client.config
  when:
    - platform_deploy_mode == "k8s"
    - not configured_kubeconfig_stat.stat.exists
      or configured_kubeconfig_stat.stat.isdir
      or (configured_kubeconfig_stat.stat.size | default(0) | int) == 0

- name: Check common kubeconfig paths
  ansible.builtin.stat:
    path: "{{ k8s_kubeconfig_candidate_path }}"
  loop: "{{ k8s_kubeconfig_candidate_paths }}"
  loop_control:
    loop_var: k8s_kubeconfig_candidate_path
    label: "{{ k8s_kubeconfig_candidate_path }}"
  register: k8s_kubeconfig_candidate_stats
  when:
    - platform_deploy_mode == "k8s"
    - k8s_kubeconfig_candidate_paths is defined

- name: Override kubeconfig path with detected working file
  ansible.builtin.set_fact:
    k8s_kubeconfig_path: >-
      {{
        (
          k8s_kubeconfig_candidate_stats.results
          | selectattr('stat.exists')
          | rejectattr('stat.isdir')
          | selectattr('stat.size', 'gt', 0)
          | map(attribute='stat.path')
          | first
        )
      }}
  when:
    - platform_deploy_mode == "k8s"
    - k8s_kubeconfig_candidate_paths is defined
    - >
      (
        k8s_kubeconfig_candidate_stats.results
        | selectattr('stat.exists')
        | rejectattr('stat.isdir')
        | selectattr('stat.size', 'gt', 0)
        | list
        | length
      ) > 0

- name: Fail when no usable kubeconfig file is found
  ansible.builtin.fail:
    msg: >-
      No usable kubeconfig file was found on {{ inventory_hostname }}.
      Checked {{ k8s_kubeconfig_candidate_paths | join(', ') }}.
      Set k8s_kubeconfig_path to the correct remote kubeconfig path if your cluster uses a different location.
  when:
    - platform_deploy_mode == "k8s"
    - k8s_kubeconfig_candidate_paths is defined
    - >
      (
        k8s_kubeconfig_candidate_stats.results
        | selectattr('stat.exists')
        | rejectattr('stat.isdir')
        | selectattr('stat.size', 'gt', 0)
        | list
        | length
      ) == 0
