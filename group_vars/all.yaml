---
#
# Edit config.yaml
# this is just mapping variable
#
install_jenkins: "{{ (destroy_all | default(false) | bool) or (jenkins | default(true) | bool) }}"
install_sonarqube: "{{ (destroy_all | default(false) | bool) or (sonarqube | default(true) | bool) }}"
install_harbor: "{{ (destroy_all | default(false) | bool) or (harbor | default(false) | bool) }}"
install_vault: "{{ (destroy_all | default(false) | bool) or (hashicorp_vault | default(false) | bool) }}"
install_minio: "{{ (destroy_all | default(false) | bool) or (minio | default(false) | bool) }}"
platform_deploy_mode: "{{ ((global_deploy_mode | default('docker')) in ['k8s', 'kubernetes']) | ternary('k8s', 'docker') }}"
k8s_kubeconfig_path: "{{ k8s_kubeconfig_override_path | default('/home/' ~ (ansible_user | default('ubuntu')) ~ '/.kube/config') }}"
install_kubectl: "{{ platform_deploy_mode == 'k8s' }}"
install_helm: "{{ platform_deploy_mode == 'k8s' and ((install_harbor | bool) or (install_vault | bool)) }}"
jenkins_state: "{{ deployment_state | default('present') }}"
sonarqube_state: "{{ deployment_state | default('present') }}"
harbor_state: "{{ deployment_state | default('present') }}"
vault_state: "{{ deployment_state | default('present') }}"
minio_state: "{{ deployment_state | default('present') }}"
jenkins_deploy_mode: "{{ platform_deploy_mode }}"
sonarqube_deploy_mode: "{{ platform_deploy_mode }}"
harbor_deploy_mode: "{{ platform_deploy_mode }}"
vault_deploy_mode: "{{ platform_deploy_mode }}"
minio_deploy_mode: "{{ platform_deploy_mode }}"
jenkins_use_domain: "{{ use_domain | default(true) | bool }}"
sonarqube_use_domain: "{{ use_domain | default(true) | bool }}"
harbor_use_domain: "{{ use_domain | default(true) | bool }}"
vault_use_domain: "{{ use_domain | default(true) | bool }}"
minio_use_domain: "{{ use_domain | default(true) | bool }}"
jenkins_enable_tls: "{{ (use_domain | default(true) | bool) and (enable_tls | default(false) | bool) }}"
sonarqube_enable_tls: "{{ (use_domain | default(true) | bool) and (enable_tls | default(false) | bool) }}"
harbor_enable_tls: "{{ (use_domain | default(true) | bool) and (enable_tls | default(false) | bool) }}"
vault_enable_tls: "{{ (use_domain | default(true) | bool) and (enable_tls | default(false) | bool) }}"
minio_enable_tls: "{{ (use_domain | default(true) | bool) and (enable_tls | default(false) | bool) }}"
jenkins_tls_email: "{{ tls_email | default('') }}"
sonarqube_tls_email: "{{ tls_email | default('') }}"
harbor_tls_email: "{{ tls_email | default('') }}"
vault_tls_email: "{{ tls_email | default('') }}"
minio_tls_email: "{{ tls_email | default('') }}"
jenkins_ingress_class_name: "{{ ingress_class_name | default('nginx') }}"
sonarqube_ingress_class_name: "{{ ingress_class_name | default('nginx') }}"
harbor_ingress_class_name: "{{ ingress_class_name | default('nginx') }}"
vault_ingress_class_name: "{{ ingress_class_name | default('nginx') }}"
minio_ingress_class_name: "{{ ingress_class_name | default('nginx') }}"
jenkins_kubeconfig_path: "{{ k8s_kubeconfig_path }}"
sonarqube_kubeconfig_path: "{{ k8s_kubeconfig_path }}"
harbor_kubeconfig_path: "{{ k8s_kubeconfig_path }}"
vault_kubeconfig_path: "{{ k8s_kubeconfig_path }}"
minio_kubeconfig_path: "{{ k8s_kubeconfig_path }}"
