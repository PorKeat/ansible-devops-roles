---
jenkins_deploy_mode: docker
jenkins_enable_tls: false
jenkins_tls_email: ""
jenkins_ingress_class_name: nginx
jenkins_kubeconfig_path: "/home/{{ ansible_user | default('ubuntu') }}/.kube/config"
jenkins_domain: ""
jenkins_install_dir: /opt/jenkins
jenkins_image: jenkins/jenkins:lts
jenkins_http_port: 8080
jenkins_agent_port: 50000
jenkins_namespace: jenkins
jenkins_storage_size: 10Gi

jenkins_manage_system_prereqs: false
jenkins_manage_base_packages: "{{ jenkins_manage_system_prereqs | bool }}"
jenkins_install_docker: "{{ jenkins_manage_system_prereqs | bool and jenkins_deploy_mode == 'docker' }}"
jenkins_install_nginx: "{{ jenkins_manage_system_prereqs | bool and jenkins_deploy_mode == 'docker' }}"
jenkins_install_certbot: "{{ jenkins_manage_system_prereqs | bool and jenkins_deploy_mode == 'docker' and jenkins_enable_tls | bool }}"
jenkins_install_kubectl: "{{ jenkins_manage_system_prereqs | bool and jenkins_deploy_mode == 'k8s' }}"
jenkins_system_user: "{{ ansible_user | default('ubuntu') }}"

jenkins_base_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - git
  - gnupg
  - lsb-release
  - python3
  - python3-apt
  - python3-pip
  - python3-setuptools
  - software-properties-common
  - unzip

jenkins_docker_packages:
  - docker.io
  - docker-compose-plugin
  - python3-docker

jenkins_nginx_packages:
  - nginx

jenkins_certbot_packages:
  - certbot
  - python3-certbot-nginx

jenkins_kubectl_apt_key_url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
jenkins_kubectl_apt_repo: deb https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /
jenkins_kubectl_packages:
  - kubectl
  - python3-kubernetes

jenkins_compose_project_name: jenkins
jenkins_compose_file: "{{ jenkins_install_dir }}/docker-compose.yml"
jenkins_container_name: jenkins
jenkins_data_dir: "{{ jenkins_install_dir }}/jenkins_home"
jenkins_java_opts: ""

jenkins_nginx_site_filename: jenkins.conf
jenkins_nginx_site_path: "/etc/nginx/sites-available/{{ jenkins_nginx_site_filename }}"
jenkins_nginx_site_enabled_path: "/etc/nginx/sites-enabled/{{ jenkins_nginx_site_filename }}"

jenkins_replicas: 1
jenkins_service_name: jenkins
jenkins_service_type: ClusterIP
jenkins_use_pvc: true
jenkins_pvc_name: jenkins-home
jenkins_persistence_access_modes:
  - ReadWriteOnce
jenkins_storage_class_name: ""

jenkins_ingress_name: jenkins
jenkins_ingress_path: /
jenkins_ingress_path_type: Prefix
jenkins_ingress_annotations: {}
jenkins_ingress_tls_secret_name: jenkins-tls

jenkins_k8s_validate_certs: true
