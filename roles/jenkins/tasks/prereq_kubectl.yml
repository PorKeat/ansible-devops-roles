---
- name: Add Kubernetes repository signing key for Jenkins role
  ansible.builtin.apt_key:
    url: "{{ jenkins_kubectl_apt_key_url }}"
    state: present

- name: Add Kubernetes apt repository for Jenkins role
  ansible.builtin.apt_repository:
    repo: "{{ jenkins_kubectl_apt_repo }}"
    filename: kubernetes
    state: present

- name: Install kubectl packages for Jenkins role
  ansible.builtin.apt:
    name: "{{ jenkins_kubectl_packages }}"
    state: present
    update_cache: true
