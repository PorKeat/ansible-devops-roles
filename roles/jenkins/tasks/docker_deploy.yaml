---
- name: Remove legacy Jenkins Compose file
  ansible.builtin.file:
    path: "{{ jenkins_install_dir }}/docker-compose.yml"
    state: absent

- name: Render Jenkins Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ jenkins_compose_file }}"
    mode: "0644"

- name: Start Jenkins Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_install_dir }}"
    project_name: "{{ jenkins_compose_project_name }}"
    state: present
    pull: "{{ jenkins_compose_pull_policy }}"
    recreate: "{{ jenkins_compose_recreate }}"
    remove_orphans: true
