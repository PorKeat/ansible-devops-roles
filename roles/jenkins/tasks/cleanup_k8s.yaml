---
- name: Remove Jenkins ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ jenkins_kubeconfig_path }}"
    validate_certs: "{{ jenkins_k8s_validate_certs }}"
    state: absent
    definition: "{{ lookup('template', 'jenkins-ingress.yaml.j2') | from_yaml }}"

- name: Remove Jenkins service
  kubernetes.core.k8s:
    kubeconfig: "{{ jenkins_kubeconfig_path }}"
    validate_certs: "{{ jenkins_k8s_validate_certs }}"
    state: absent
    definition: "{{ lookup('template', 'jenkins-service.yaml.j2') | from_yaml }}"

- name: Remove Jenkins deployment
  kubernetes.core.k8s:
    kubeconfig: "{{ jenkins_kubeconfig_path }}"
    validate_certs: "{{ jenkins_k8s_validate_certs }}"
    state: absent
    definition: "{{ lookup('template', 'jenkins-deployment.yaml.j2') | from_yaml }}"

- name: Remove Jenkins persistent volume claim
  kubernetes.core.k8s:
    kubeconfig: "{{ jenkins_kubeconfig_path }}"
    validate_certs: "{{ jenkins_k8s_validate_certs }}"
    state: absent
    definition: "{{ lookup('template', 'jenkins-pvc.yaml.j2') | from_yaml }}"
  when: jenkins_use_pvc | bool

- name: Remove Jenkins namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ jenkins_kubeconfig_path }}"
    validate_certs: "{{ jenkins_k8s_validate_certs }}"
    state: absent
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ jenkins_namespace }}"
  when: jenkins_cleanup_remove_namespace | bool

- name: Gather service facts for Jenkins Kubernetes cleanup
  ansible.builtin.service_facts:

- name: Remove Jenkins Nginx enabled site for Kubernetes mode
  ansible.builtin.file:
    path: "{{ jenkins_nginx_site_enabled_path }}"
    state: absent
  register: jenkins_k8s_nginx_enabled_cleanup

- name: Remove Jenkins Nginx site file for Kubernetes mode
  ansible.builtin.file:
    path: "{{ jenkins_nginx_site_path }}"
    state: absent
  register: jenkins_k8s_nginx_site_cleanup

- name: Validate Nginx configuration after Jenkins Kubernetes cleanup
  ansible.builtin.command: nginx -t
  changed_when: false
  when: "'nginx.service' in ansible_facts.services"

- name: Restart Nginx after Jenkins Kubernetes cleanup
  ansible.builtin.service:
    name: nginx
    state: restarted
  when:
    - "'nginx.service' in ansible_facts.services"
    - jenkins_k8s_nginx_enabled_cleanup.changed or jenkins_k8s_nginx_site_cleanup.changed
