---
- name: Ensure MinIO installation directory exists
  ansible.builtin.file:
    path: "{{ minio_install_dir }}"
    state: directory
    mode: "0755"

- name: Ensure MinIO data directory exists
  ansible.builtin.file:
    path: "{{ minio_data_dir }}"
    state: directory
    mode: "0755"

- name: Remove legacy MinIO Compose file
  ansible.builtin.file:
    path: "{{ minio_install_dir }}/docker-compose.yml"
    state: absent

- name: Render MinIO Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ minio_compose_file }}"
    mode: "0644"

- name: Start MinIO Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ minio_install_dir }}"
    project_name: "{{ minio_compose_project_name }}"
    state: present
    pull: "{{ minio_compose_pull_policy }}"
    recreate: "{{ minio_compose_recreate }}"
    remove_orphans: true
