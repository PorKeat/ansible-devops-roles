---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time }}"

- name: Render shared sysctl config
  ansible.builtin.template:
    src: common-sysctl.conf.j2
    dest: "{{ common_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload sysctl in common
