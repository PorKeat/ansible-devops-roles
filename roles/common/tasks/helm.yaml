---
- name: Ensure Helm apt keyring directory exists
  ansible.builtin.file:
    path: "{{ helm_apt_keyring_dir }}"
    state: directory
    mode: "0755"

- name: Add Helm repository signing key
  ansible.builtin.apt_key:
    url: "{{ helm_apt_key_url }}"
    keyring: "{{ helm_apt_key_path }}"
    state: present

- name: Add Helm apt repository
  ansible.builtin.apt_repository:
    repo: "{{ helm_apt_repo }}"
    filename: "{{ helm_apt_repo_filename }}"
    state: present
    update_cache: true

- name: Install Helm packages
  ansible.builtin.apt:
    name: "{{ helm_packages }}"
    state: present
    install_recommends: false
