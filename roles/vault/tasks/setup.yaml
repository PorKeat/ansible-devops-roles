---
- name: Check Vault initialization status
  ansible.builtin.command:
    cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 {{ vault_container_name }} vault status -format=json"
  register: vault_status_raw
  failed_when: false
  changed_when: false
  until: vault_status_raw.rc == 0 or vault_status_raw.rc == 2
  retries: 10
  delay: 5

- name: Parse Vault status
  ansible.builtin.set_fact:
    vault_status: "{{ vault_status_raw.stdout | from_json | default({'initialized': true}) }}"
  when: vault_status_raw.rc == 0 or vault_status_raw.rc == 2

- name: Setup Vault if not initialized
  when: not (vault_status.initialized | default(true))
  block:
    - name: Initialize Vault
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 {{ vault_container_name }} vault operator init -format=json"
      register: vault_init_output
      no_log: false

    - name: Save Vault credentials locally
      ansible.builtin.copy:
        content: "{{ vault_init_output.stdout }}"
        dest: "{{ playbook_dir | dirname }}/vault_init.json"
      delegate_to: localhost

    - name: Parse initialization data
      ansible.builtin.set_fact:
        vault_init_data: "{{ vault_init_output.stdout | from_json }}"
      no_log: false

    - name: Unseal Vault
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 {{ vault_container_name }} vault operator unseal {{ item }}"
      loop: "{{ vault_init_data.unseal_keys_b64[:3] }}"
      no_log: true
      changed_when: true

    - name: Enable KV v2 engine
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN={{ vault_init_data.root_token }} {{ vault_container_name }} vault secrets enable -path={{ vault_namespace }} kv-v2"
      register: vault_enable_kv
      failed_when: false
      changed_when: true

    - name: Add a8s account secret
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN={{ vault_init_data.root_token }} {{ vault_container_name }} vault kv put {{ vault_namespace }}/account/a8s username=a8s password=123456"
      changed_when: true
      no_log: true

    - name: Enable AppRole authentication
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN={{ vault_init_data.root_token }} {{ vault_container_name }} vault auth enable approle"
      changed_when: true

    - name: Create configserver-policy file on host
      ansible.builtin.copy:
        content: |
          path "kv/data/account" {
            capabilities = ["read"]
          }
          path "kv/data/account/*" {
            capabilities = ["read"]
          }
        dest: /tmp/configserver-policy.hcl
        mode: "0644"

    - name: Copy configserver-policy into Vault container
      ansible.builtin.command:
        cmd: "docker cp /tmp/configserver-policy.hcl {{ vault_container_name }}:/tmp/configserver-policy.hcl"
      changed_when: false

    - name: Write configserver-policy to Vault
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN={{ vault_init_data.root_token }} {{ vault_container_name }} vault policy write configserver-policy /tmp/configserver-policy.hcl"
      changed_when: true

    - name: Create configserver-role
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN={{ vault_init_data.root_token }} {{ vault_container_name }} vault write auth/approle/role/configserver-role token_policies=\"configserver-policy\" token_type=\"batch\""
      changed_when: true

    - name: Get RoleID
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN={{ vault_init_data.root_token }} {{ vault_container_name }} vault read -field=role_id auth/approle/role/configserver-role/role-id"
      register: approle_role_id
      changed_when: false
      no_log: false

    - name: Get SecretID
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN={{ vault_init_data.root_token }} {{ vault_container_name }} vault write -f -field=secret_id auth/approle/role/configserver-role/secret-id"
      register: approle_secret_id
      changed_when: true
      no_log: false

    - name: Print Vault Credentials
      ansible.builtin.debug:
        msg: |
          ==================================================
          VAULT INITIALIZATION COMPLETE
          ==================================================
          
          Root Token:
          {{ vault_init_data.root_token }}
          
          Unseal Keys:
          1. {{ vault_init_data.unseal_keys_b64[0] }}
          2. {{ vault_init_data.unseal_keys_b64[1] }}
          3. {{ vault_init_data.unseal_keys_b64[2] }}
          4. {{ vault_init_data.unseal_keys_b64[3] }}
          5. {{ vault_init_data.unseal_keys_b64[4] }}
          
          AppRole configserver-role:
          RoleID:   {{ approle_role_id.stdout }}
          SecretID: {{ approle_secret_id.stdout }}
          
          ==================================================
          IMPORTANT: Save these credentials securely!
          They will not be displayed again.
          ==================================================

- name: Auto-unseal Vault if initialized but sealed
  when:
    - vault_auto_unseal | default(true) | bool
    - vault_status.initialized | default(false)
    - vault_status.sealed | default(false)
  block:
    - name: Load Vault credentials from local file
      ansible.builtin.set_fact:
        vault_init_data: "{{ lookup('file', playbook_dir | dirname ~ '/vault_init.json', errors='ignore') | from_json | default({}) }}"
      delegate_to: localhost

    - name: Fail if vault_init.json is missing
      ansible.builtin.fail:
        msg: "Vault is sealed but vault_init.json is missing locally. Please unseal manually."
      when: vault_init_data.unseal_keys_b64 is not defined

    - name: Unseal Vault automatically
      ansible.builtin.command:
        cmd: "docker exec -e VAULT_ADDR=http://127.0.0.1:8200 {{ vault_container_name }} vault operator unseal {{ item }}"
      loop: "{{ vault_init_data.unseal_keys_b64[:3] }}"
      no_log: true
      changed_when: true
