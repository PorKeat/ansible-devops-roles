---
- name: Install SonarQube Docker packages
  ansible.builtin.apt:
    name: "{{ sonarqube_docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Docker service is enabled and running for SonarQube
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add SonarQube system user to docker group
  ansible.builtin.user:
    name: "{{ sonarqube_system_user }}"
    groups: docker
    append: true
  when: sonarqube_system_user | length > 0
