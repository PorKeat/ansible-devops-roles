---
- name: Validate SonarQube configuration
  ansible.builtin.include_tasks: validate.yml

- name: Prepare SonarQube host prerequisites
  ansible.builtin.include_tasks: prerequisites.yml
  when: sonarqube_manage_system_prereqs | bool

- name: Deploy SonarQube in Docker mode
  ansible.builtin.include_tasks: docker.yml
  when: sonarqube_deploy_mode == "docker"

- name: Deploy SonarQube in Kubernetes mode
  ansible.builtin.include_tasks: k8s.yml
  when: sonarqube_deploy_mode == "k8s"
