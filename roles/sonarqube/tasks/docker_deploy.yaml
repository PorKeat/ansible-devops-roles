---
- name: Remove legacy SonarQube Compose file
  ansible.builtin.file:
    path: "{{ sonarqube_install_dir }}/docker-compose.yml"
    state: absent

- name: Render SonarQube Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ sonarqube_compose_file }}"
    mode: "0644"

- name: Start SonarQube Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ sonarqube_install_dir }}"
    project_name: "{{ sonarqube_compose_project_name }}"
    state: present
    pull: "{{ sonarqube_compose_pull_policy }}"
    recreate: "{{ sonarqube_compose_recreate }}"
    remove_orphans: true
