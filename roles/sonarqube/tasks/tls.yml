---
- name: Resolve SonarQube domain before requesting TLS certificate
  ansible.builtin.command:
    cmd: "getent ahosts {{ sonarqube_domain }}"
  register: sonarqube_domain_resolution
  changed_when: false
  failed_when: false

- name: Collect resolved IP addresses for SonarQube domain
  ansible.builtin.set_fact:
    sonarqube_domain_resolved_ips: "{{ sonarqube_domain_resolution.stdout_lines | map('regex_replace', '\\s+.*$', '') | unique | list }}"

- name: Determine whether SonarQube TLS DNS is ready
  ansible.builtin.set_fact:
    sonarqube_tls_dns_ready: >-
      {{
        sonarqube_domain_resolution.rc == 0 and (
          (ansible_host | regex_search('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')) is none
          or ansible_host in sonarqube_domain_resolved_ips
        )
      }}

- name: Skip SonarQube TLS until DNS points to this server
  ansible.builtin.debug:
    msg: >-
      Skipping SonarQube TLS because {{ sonarqube_domain }} is not resolvable yet
      or does not point to {{ ansible_host }}.
  when:
    - sonarqube_tls_skip_if_dns_not_ready | bool
    - not sonarqube_tls_dns_ready | bool

- name: Request or renew SonarQube certificate with Certbot
  ansible.builtin.command:
    cmd: >-
      certbot --nginx --non-interactive --agree-tos --redirect
      --email {{ sonarqube_tls_email }}
      -d {{ sonarqube_domain }}
  args:
    creates: "/etc/letsencrypt/live/{{ sonarqube_domain }}/fullchain.pem"
  register: sonarqube_certbot_result
  changed_when: "'Certificate not yet due for renewal' not in sonarqube_certbot_result.stdout"
  when:
    - not sonarqube_tls_skip_if_dns_not_ready | bool
      or sonarqube_tls_dns_ready | bool
