---
sonarqube_deploy_mode: docker
sonarqube_enable_tls: false
sonarqube_tls_email: ""
sonarqube_ingress_class_name: nginx
sonarqube_kubeconfig_path: "/home/{{ ansible_user | default('ubuntu') }}/.kube/config"
sonarqube_domain: ""
sonarqube_install_dir: /opt/sonarqube
sonarqube_http_port: 9000
postgres_port: 5432
sonarqube_image: sonarqube:community
postgres_image: postgres:15
sonarqube_namespace: sonarqube
sonarqube_storage_size: 10Gi
postgres_storage_size: 8Gi

sonarqube_manage_system_prereqs: false
sonarqube_manage_base_packages: "{{ sonarqube_manage_system_prereqs | bool }}"
sonarqube_install_docker: "{{ sonarqube_manage_system_prereqs | bool and sonarqube_deploy_mode == 'docker' }}"
sonarqube_install_nginx: "{{ sonarqube_manage_system_prereqs | bool and sonarqube_deploy_mode == 'docker' }}"
sonarqube_install_certbot: "{{ sonarqube_manage_system_prereqs | bool and sonarqube_deploy_mode == 'docker' and sonarqube_enable_tls | bool }}"
sonarqube_install_kubectl: "{{ sonarqube_manage_system_prereqs | bool and sonarqube_deploy_mode == 'k8s' }}"
sonarqube_system_user: "{{ ansible_user | default('ubuntu') }}"

sonarqube_base_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - git
  - gnupg
  - lsb-release
  - python3
  - python3-apt
  - python3-pip
  - python3-setuptools
  - software-properties-common
  - unzip

sonarqube_sysctl_settings:
  - name: vm.max_map_count
    value: "262144"
  - name: fs.file-max
    value: "65536"

sonarqube_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - python3-docker
sonarqube_docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - podman-docker
  - containerd
  - runc
sonarqube_remove_conflicting_docker_packages: true
sonarqube_docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
sonarqube_docker_apt_keyring_dir: /etc/apt/keyrings
sonarqube_docker_apt_key_path: "{{ sonarqube_docker_apt_keyring_dir }}/docker.asc"
sonarqube_docker_apt_repo_filename: docker
sonarqube_docker_apt_repo: >-
  deb [signed-by={{ sonarqube_docker_apt_key_path }}]
  https://download.docker.com/linux/ubuntu
  {{ ansible_facts['distribution_release'] | lower }}
  stable

sonarqube_tls_skip_if_dns_not_ready: true

sonarqube_nginx_packages:
  - nginx

sonarqube_certbot_packages:
  - certbot
  - python3-certbot-nginx

sonarqube_kubectl_apt_key_url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
sonarqube_kubectl_apt_repo: deb https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /
sonarqube_kubectl_packages:
  - kubectl
  - python3-kubernetes

sonarqube_compose_project_name: sonarqube
sonarqube_compose_file: "{{ sonarqube_install_dir }}/docker-compose.yml"
sonarqube_container_name: sonarqube
postgres_container_name: sonarqube-postgresql

sonarqube_nginx_site_filename: sonarqube.conf
sonarqube_nginx_site_path: "/etc/nginx/sites-available/{{ sonarqube_nginx_site_filename }}"
sonarqube_nginx_site_enabled_path: "/etc/nginx/sites-enabled/{{ sonarqube_nginx_site_filename }}"

sonarqube_service_name: sonarqube
postgres_service_name: postgresql

sonarqube_use_pvc: true
postgres_use_pvc: true

sonarqube_pvc_name: sonarqube-data
postgres_pvc_name: sonarqube-postgresql

sonarqube_persistence_access_modes:
  - ReadWriteOnce
postgres_persistence_access_modes:
  - ReadWriteOnce

sonarqube_storage_class_name: ""
postgres_storage_class_name: ""

sonarqube_ingress_name: sonarqube
sonarqube_ingress_path: /
sonarqube_ingress_path_type: Prefix
sonarqube_ingress_annotations: {}
sonarqube_ingress_tls_secret_name: sonarqube-tls

sonarqube_replicas: 1
postgres_replicas: 1

sonarqube_db_name: sonarqube
sonarqube_db_user: sonarqube
sonarqube_db_password: change_me_password

sonarqube_k8s_validate_certs: true
