---
- name: Set Harbor displayed host
  ansible.builtin.set_fact:
    harbor_display_host: >-
      {{
        (
          harbor_use_domain | bool
          and (harbor_domain | default('')) | length > 0
        )
        | ternary(harbor_domain, ansible_host)
      }}

- name: Set Harbor displayed scheme
  ansible.builtin.set_fact:
    harbor_display_scheme: "{{ (harbor_enable_tls | bool) | ternary('https', 'http') }}"

- name: Set Harbor displayed port
  ansible.builtin.set_fact:
    harbor_display_port: "{{ (harbor_enable_tls | bool) | ternary(harbor_https_port, harbor_http_port) }}"

- name: Set Harbor public URL
  ansible.builtin.set_fact:
    harbor_public_url: >-
      {{
        harbor_display_scheme ~ '://' ~ harbor_display_host
        ~ (
            ((harbor_display_port | int) in [80, 443])
            | ternary('', ':' ~ (harbor_display_port | string))
          )
      }}

- name: Check Harbor installer script
  ansible.builtin.stat:
    path: "{{ harbor_install_script_path }}"
  register: harbor_install_script

- name: Check Harbor version file
  ansible.builtin.stat:
    path: "{{ harbor_version_file }}"
  register: harbor_version_file_stat

- name: Check Harbor Trivy state file
  ansible.builtin.stat:
    path: "{{ harbor_trivy_state_file }}"
  register: harbor_trivy_state_file_stat

- name: Read current Harbor version
  ansible.builtin.slurp:
    src: "{{ harbor_version_file }}"
  register: harbor_version_file_content
  when: harbor_version_file_stat.stat.exists

- name: Read current Harbor Trivy state
  ansible.builtin.slurp:
    src: "{{ harbor_trivy_state_file }}"
  register: harbor_trivy_state_file_content
  when: harbor_trivy_state_file_stat.stat.exists

- name: Set current Harbor version
  ansible.builtin.set_fact:
    harbor_current_version: "{{ (harbor_version_file_content.content | b64decode | trim) if (harbor_version_file_stat.stat.exists) else '' }}"

- name: Set current Harbor Trivy enabled state
  ansible.builtin.set_fact:
    harbor_current_trivy_enabled: "{{ ((harbor_trivy_state_file_content.content | b64decode | trim) if (harbor_trivy_state_file_stat.stat.exists) else 'false') | bool }}"

- name: Determine whether Harbor installer extraction is required
  ansible.builtin.set_fact:
    harbor_extract_required: >-
      {{
        not harbor_install_script.stat.exists
        or (harbor_current_version | default('')) != harbor_version
      }}

- name: Determine whether Harbor Trivy change is required
  ansible.builtin.set_fact:
    harbor_trivy_change_required: "{{ harbor_current_trivy_enabled | bool != harbor_trivy_enabled | bool }}"

- name: Remove old Harbor installer directory when version changes
  ansible.builtin.file:
    path: "{{ harbor_install_dir }}"
    state: absent
  when:
    - harbor_install_script.stat.exists
    - (harbor_current_version | default('')) != harbor_version

- name: Download Harbor online installer
  ansible.builtin.get_url:
    url: "{{ harbor_installer_url }}"
    dest: "{{ harbor_installer_archive }}"
    mode: "0644"
  when: harbor_extract_required | bool

- name: Extract Harbor installer
  ansible.builtin.unarchive:
    src: "{{ harbor_installer_archive }}"
    dest: "{{ harbor_install_dir_parent }}"
    remote_src: true
  when: harbor_extract_required | bool

- name: Ensure Harbor data directory exists
  ansible.builtin.file:
    path: "{{ harbor_data_dir }}"
    state: directory
    mode: "0755"

- name: Ensure Harbor log directory exists
  ansible.builtin.file:
    path: "{{ harbor_log_dir }}"
    state: directory
    mode: "0755"

- name: Render Harbor config file
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: "{{ harbor_install_dir }}/harbor.yml"
    mode: "0644"
  register: harbor_config_file

- name: Render Harbor docker-compose.override.yml
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ harbor_install_dir }}/docker-compose.override.yml"
    mode: "0644"

- name: Check Harbor compose file
  ansible.builtin.stat:
    path: "{{ harbor_compose_file }}"
  register: harbor_compose_file_stat

- name: Run Harbor installer
  ansible.builtin.command:
    cmd: "./install.sh{% if harbor_trivy_enabled | bool %} --with-trivy{% endif %}"
  args:
    chdir: "{{ harbor_install_dir }}"
  environment:
    TERM: dumb
  when: >-
    harbor_extract_required | bool
    or harbor_trivy_change_required | bool
    or harbor_config_file.changed
    or not harbor_compose_file_stat.stat.exists

- name: Write Harbor version file
  ansible.builtin.copy:
    dest: "{{ harbor_version_file }}"
    content: "{{ harbor_version }}\n"
    mode: "0644"
  when: >-
    harbor_extract_required | bool
    or harbor_trivy_change_required | bool
    or harbor_config_file.changed
    or not harbor_compose_file_stat.stat.exists

- name: Write Harbor Trivy state file
  ansible.builtin.copy:
    dest: "{{ harbor_trivy_state_file }}"
    content: "{{ harbor_trivy_enabled | bool | ternary('true', 'false') }}\n"
    mode: "0644"
  when: >-
    harbor_extract_required | bool
    or harbor_trivy_change_required | bool
    or harbor_config_file.changed
    or not harbor_compose_file_stat.stat.exists

- name: Wait for Harbor port to open
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ harbor_display_port | int }}"
    timeout: "{{ harbor_port_wait_timeout }}"
    delay: 0

- name: Show Harbor access information
  ansible.builtin.include_tasks: access.yaml
